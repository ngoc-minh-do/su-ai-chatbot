name: su-ai-chatbot-github-runner

services:
  worker:
    image: myoung34/github-runner:ubuntu-noble
    container_name: su-ai-chatbot-github-runner
    environment:
      TZ: Asia/Tokyo
      REPO_URL: https://github.com/ngoc-minh-do/su-ai-chatbot
      RUNNER_NAME: docker-02
      ACCESS_TOKEN: $ACCESS_TOKEN
      RUNNER_SCOPE: "repo"
      LABELS: linux,x64,gpu
      RUNNER_WORKDIR: /tmp/runner/work
      CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /runner/data
      DISABLE_AUTOMATIC_DEREGISTRATION: "true"
    security_opt:
      # needed on SELinux systems to allow docker container to manage other docker containers
      - label:disable
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "/mnt/linux/docker/runner-data/su-ai-chatbot:/runner/data"
      - "/tmp/github-runner/su-ai-chatbot:/tmp/runner"
    restart: unless-stopped
