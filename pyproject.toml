[project]
name = "su-ai-chatbot"
version = "0.1.0"
description = "AI chatbot for Sharefull Shift service — RAG-powered Japanese-language assistant"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "accelerate>=1.10.0",
    "beautifulsoup4>=4.13.4",
    "bitsandbytes>=0.46.1",
    "gradio>=5.42.0",
    "grandalf>=0.8",
    "huggingface-hub>=0.34.4",
    "langchain>=0.3.27",
    "langchain-community>=0.3.27",
    "langchain-huggingface>=0.3.1",
    "langchain-ollama>=0.3.6",
    "langchain-openai>=0.3.29",
    "langchain-qdrant>=0.2.0",
    "llama-cpp-python>=0.3.34",
    "lxml>=6.0.0",
    "psycopg>=3.2.0",
    "python-dotenv>=1.1.1",
    "qdrant-client>=1.15.1",
    "sentence-transformers>=5.1.0",
    "sentencepiece>=0.2.0",
    "sqlalchemy>=2.0.42",
    "torch>=2.8.0",
    "transformers>=4.55.0",
]

[build-system]
requires = ["uv_build>=0.0,<0.14"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "llama-cpp-python-wheel"
url = "https://abetlen.github.io/llama-cpp-python/whl/cu132"
explicit = true

[tool.uv.sources]
llama-cpp-python = { index = "llama-cpp-python-wheel" }

[tool.uv.build-backend]
module-name = "SuAi"

[tool.ruff.lint]
# `SuAi` is a deliberately camelCase package name; Gradio UI callbacks
# intentionally catch broad exceptions so a single failing handler doesn't
# take down the interface.
ignore = ["N999", "BLE001"]

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "ruff>=0.12.8",
    "ty>=0.0.90",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
