name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
      - name: Install dependencies
        run: uv sync
      - name: Lint
        run: uv run ruff check
      - name: Format check
        run: uv run ruff format --check
      - name: Tests
        run: uv run pytest
      - name: Type check
        run: uv run pyright

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: Write env file
        run: |
          cat > .env.prod <<'EOF'
          DATA_DIR="/su-ai-chatbot"
          HF_HOME="${DATA_DIR}/huggingface"
          HF_HUB_CACHE="${HF_HOME}/hub"
          TRANSFORMERS_CACHE="${HF_HUB_CACHE}"
          HF_TOKEN=${{ secrets.HF_TOKEN }}
          TOKENIZERS_PARALLELISM=false
          LOGLEVEL="INFO"
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_URL="http://bifrost.docker-03.local/v1"
          OPENAI_MODEL="chat-default"
          OLLAMA_URL="http://ollama.docker-02.local"
          OLLAMA_MODEL="deepseek-r1:8b"
          QDRANT_URL="http://192.168.0.41:6333"
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          EOF
      - name: Deploy
        run: |
          chmod +x ./deploy.sh
          ./deploy.sh
