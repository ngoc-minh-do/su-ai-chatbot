name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: deploy
        run: |
          #!/bin/bash
          set -e
          set -x

          chmod +x ./deploy.sh
          ./deploy.sh
