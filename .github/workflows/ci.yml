name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa
      - name: Install dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check
      - name: Format check
        run: uv run ruff format --check
      - name: Tests
        run: uv run pytest
      - name: Type check
        run: uv run pyright

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v7
      - name: Write env file
        run: |
          cat > .env.prod <<'EOF'
          DATA_DIR="/su-ai-chatbot"
          HF_HOME="${DATA_DIR}/huggingface"
          HF_HUB_CACHE="${HF_HOME}/hub"
          TRANSFORMERS_CACHE="${HF_HUB_CACHE}"
          HF_TOKEN=${{ secrets.HF_TOKEN }}
          TOKENIZERS_PARALLELISM=false
          LOGLEVEL="INFO"
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_URL=${{ vars.OPENAI_API_URL }}
          OPENAI_MODEL=${{ vars.OPENAI_MODEL }}
          OLLAMA_URL=${{ vars.OLLAMA_URL }}
          OLLAMA_MODEL=${{ vars.OLLAMA_MODEL }}
          QDRANT_URL=${{ vars.QDRANT_URL }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          EOF
      - name: Deploy
        run: |
          chmod +x ./deploy.sh
          ./deploy.sh
