name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7
      - name: write env file
        run: |
          cat > .env.prod <<'EOF'
          DATA_DIR="/su-ai-chatbot"
          HF_HOME="${DATA_DIR}/huggingface"
          HF_HUB_CACHE="${HF_HOME}/hub"
          TRANSFORMERS_CACHE="${HF_HUB_CACHE}"
          HF_TOKEN=${{ secrets.HF_TOKEN }}
          TOKENIZERS_PARALLELISM=false
          LOGLEVEL="INFO"
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_URL="http://litellm.docker-02.local"
          OPENAI_MODEL="mistral/devstral-small-latest"
          OLLAMA_URL="http://ollama.docker-02.local"
          OLLAMA_MODEL="deepseek-r1:8b"
          QDRANT_URL="http://REDACTED_IP:6333"
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          EOF
      - name: deploy
        run: |
          #!/bin/bash
          set -e
          set -x

          chmod +x ./deploy.sh
          ./deploy.sh
